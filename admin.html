<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Заказы</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=21" />
  </head>
  <body data-page="admin">
    <div class="admin-lock" id="adminLock">
      <form class="admin-login" id="adminLogin" autocomplete="off">
        <p class="eyebrow">Только для владельца</p>
        <h1>Заказы</h1>
        <label class="checkout__field">
          <span>Пароль</span>
          <input name="password" type="password" required autocomplete="current-password" />
        </label>
        <p class="admin-login__error" id="adminLoginError" hidden>Неверный пароль</p>
        <button type="submit" class="btn btn-primary">Войти</button>
      </form>
    </div>

    <div class="admin-shell" id="adminApp" hidden>
      <header class="admin-bar">
        <div>
          <p class="eyebrow">Владелец</p>
          <h1>Заказы</h1>
        </div>
        <button type="button" class="btn" id="adminLogout">Выйти</button>
      </header>
      <div class="admin-head">
        <div class="admin-stats" id="adminStats"></div>
        <div class="segment" role="group" aria-label="Фильтр заказов">
          <button type="button" class="btn is-active" data-order-filter="all">Все</button>
          <button type="button" class="btn" data-order-filter="new">Новые</button>
          <button type="button" class="btn" data-order-filter="done">Выполненные</button>
        </div>
      </div>
      <div id="adminBoard"></div>
    </div>

    <script src="store.js?v=21"></script>
    <script src="admin.js?v=3"></script>
  </body>
</html>
